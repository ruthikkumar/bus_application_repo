<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halt – Book bus tickets</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#EDF1F2;--ink:#172227;--card:#fff;--line:#D3DCDE;--muted:#57686D;--acc:#F2B90F;--accink:#172227;--band:#172227;--bandink:#EDF1F2;--booked:#CBD2D4;--ok:#1F7A4D;--err:#B3372A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1719;--ink:#EAF0F1;--card:#172124;--line:#2A383D;--muted:#93A5AA;--band:#0A1012;--booked:#2C3A3F;--ok:#4CC38A;--err:#F0796B}}
:root[data-theme="dark"]{--bg:#0F1719;--ink:#EAF0F1;--card:#172124;--line:#2A383D;--muted:#93A5AA;--band:#0A1012;--booked:#2C3A3F;--ok:#4CC38A;--err:#F0796B}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,h3,.brand{font-family:'Bricolage Grotesque','DM Sans',sans-serif;margin:0;letter-spacing:-.02em}
.band{background:var(--band);color:var(--bandink);padding:22px 20px 96px}
.wrap{max-width:920px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;font-size:1.6rem;display:flex;gap:10px;align-items:center}
.brand b{background:var(--acc);color:var(--accink);border-radius:8px;padding:0 9px}
.steps{display:flex;gap:6px;font-size:.85rem;color:#93A5AA}
.steps span{padding:4px 10px;border-radius:99px}.steps .on{background:var(--acc);color:var(--accink);font-weight:700}
.hero{margin-top:34px;max-width:560px}.hero h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.02;font-weight:800}
.hero p{color:#A9BABE;margin:12px 0 0}
main{max-width:920px;margin:-70px auto 60px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.search{display:grid;grid-template-columns:1fr auto 1fr 1fr auto;gap:12px;align-items:end;box-shadow:0 12px 32px rgba(0,0,0,.18)}
label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px;font-weight:500}
select,input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
select:focus,input:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0}
.btn{background:var(--acc);color:var(--accink);font-weight:700;border-radius:10px;padding:0 22px;min-height:46px}
.btn:hover{filter:brightness(.95)}.btn:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:none;color:var(--muted);text-decoration:underline;padding:8px 0}
.swap{background:var(--bg);border:1.5px solid var(--line);border-radius:50%;width:46px;height:46px;color:var(--ink);font-size:1.1rem}
.list{margin-top:22px;display:grid;gap:12px}
.list h2{font-size:1.25rem;margin-top:8px}.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.bus{display:grid;grid-template-columns:1.2fr 2fr auto;gap:16px;align-items:center}
.op{font-weight:700}.tag{display:inline-block;font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--muted);margin-top:4px}
.route{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.route strong{font:700 1.3rem 'Bricolage Grotesque'}
.line{height:2px;background:repeating-linear-gradient(90deg,var(--muted) 0 6px,transparent 6px 11px);position:relative;text-align:center}
.line em{position:absolute;left:50%;top:-11px;transform:translateX(-50%);background:var(--card);padding:0 8px;font-style:normal;font-size:.8rem;color:var(--muted)}
.price{text-align:right}.price strong{font:800 1.5rem 'Bricolage Grotesque';display:block}
.left{font-size:.82rem;color:var(--ok);font-weight:500}.left.low{color:var(--err)}
.layout{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.deck{max-width:300px;margin:12px auto 0;border:2px solid var(--ink);border-radius:26px 26px 12px 12px;padding:14px 18px 18px}
.drv{text-align:right;font-size:.78rem;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr 22px 1fr 1fr;gap:8px;margin-bottom:8px}
.seat{height:38px;border-radius:8px 8px 4px 4px;background:var(--card);border:1.5px solid var(--ink);color:var(--ink);font-size:.78rem;font-weight:700}
.seat:hover:not(:disabled){background:var(--acc);color:var(--accink)}
.seat:disabled{background:var(--booked);border-color:var(--booked);color:var(--muted);cursor:not-allowed}
.seat[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.key{display:flex;gap:16px;font-size:.82rem;color:var(--muted);justify-content:center;margin-top:12px}
.key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;border:1.5px solid var(--ink);vertical-align:-1px}
.sum h3{font-size:1.15rem;margin-bottom:8px}.sum dl{margin:0}.sum .r{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.sum .tot{font:800 1.3rem 'Bricolage Grotesque';border:0;padding-top:12px}
.pax{display:grid;gap:12px;margin-top:14px}.pax .g{display:grid;grid-template-columns:70px 1fr 90px;gap:10px;align-items:end}
.seatpill{background:var(--ink);color:var(--bg);border-radius:8px;text-align:center;padding:11px 0;font-weight:700}
.err{color:var(--err);font-size:.88rem;margin-top:8px;min-height:1.3em}
.ticket{max-width:560px;margin:0 auto;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.tk1{padding:22px;background:var(--band);color:var(--bandink)}.tk1 .route strong{font-size:1.8rem}.tk1 .line em{background:var(--band)}
.tk2{padding:22px;position:relative;border-top:2px dashed var(--line)}
.tk2:before,.tk2:after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.tk2:before{left:-11px}.tk2:after{right:-11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid2 small{color:var(--muted);display:block}
.ok{color:var(--ok);font-weight:700}
.bars{height:46px;margin-top:16px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 6px,transparent 6px 10px,var(--ink) 10px 13px,transparent 13px 15px);border-radius:3px}
.acts{display:flex;gap:12px;justify-content:center;margin-top:18px}
@media(max-width:760px){.search{grid-template-columns:1fr 1fr}.search>.fr,.search>.to,.search>.dt{grid-column:1/-1}.swap{justify-self:end;margin-top:-4px}.bus{grid-template-columns:1fr}.price{text-align:left}.layout{grid-template-columns:1fr}.steps{display:none}.pax .g{grid-template-columns:56px 1fr}.pax .g .age{grid-column:1/-1}}
@media print{.band,.acts,.ghost{display:none}main{margin:0}}
</style>
</head>
<body>
<div class="band"><div class="wrap">
  <div class="top"><div class="brand"><b>H</b>Halt</div><div class="steps" id="steps"></div></div>
  <div class="hero"><h1>Pick your bus. Pick your seat.</h1><p>Overnight sleepers and daytime seaters between the cities of Andhra Pradesh, Telangana, Tamil Nadu and Karnataka.</p></div>
</div></div>
<main id="app"></main>

<script>
const CITIES=["Vijayawada","Hyderabad","Visakhapatnam","Chennai","Bengaluru","Tirupati","Guntur","Rajahmundry","Nellore"];
const OPS=["Kaveri Travels","SRS Express","Orange Lines","Sri Krishna Tours","Jabbar Coaches"];
const TYPES=[["Volvo AC Seater",1.15],["AC Sleeper",1.3],["Non-AC Seater",.8],["AC Sleeper",1.35],["Volvo AC Seater",1.1]];
const DEPS=[360,780,1140,1230,1335];
const S={from:"Vijayawada",to:"Hyderabad",date:"",searched:false,step:0,bus:null,seats:[],err:""};
const $=s=>document.querySelector(s), app=$("#app");
const d=new Date();d.setDate(d.getDate()+1);S.date=d.toISOString().slice(0,10);
const hash=s=>{let h=0;for(const c of s)h=Math.imul(31,h)+c.charCodeAt(0)|0;return h};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const pad=n=>String(n).padStart(2,"0"), hm=m=>pad(Math.floor(m/60)%24)+":"+pad(m%60);
const inr=n=>"₹"+n.toLocaleString("en-IN");
const fdate=s=>new Date(s+"T00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});
const ROWS=10, LET=["A","B","","C","D"];

function makeBuses(){
  const r=rng(hash([S.from,S.to].sort().join()));
  const hrs=4+r()*7, base=Math.round((hrs*70+r()*120)/10)*10;
  return DEPS.map((dep,i)=>{
    const id=`${S.from}-${S.to}-${S.date}-${i}`, rs=rng(hash(id));
    const booked=[];for(let n=1;n<=ROWS;n++)for(const l of LET)if(l&&rs()<.35)booked.push(n+l);
    const dur=Math.round(hrs*60+(r()-.5)*40), arr=dep+dur;
    return{id,op:OPS[i],type:TYPES[i][0],dep,arr,dur,booked,price:Math.round(base*TYPES[i][1]/10)*10,total:ROWS*4};
  });
}
const dur=m=>Math.floor(m/60)+"h "+pad(m%60)+"m";
const arrTxt=b=>hm(b.arr)+(b.arr>=1440?" +1":"");

function steps(){
  const n=["Search","Seats","Passengers","Ticket"];
  $("#steps").innerHTML=n.map((t,i)=>`<span class="${i===S.step?"on":""}">${t}</span>`).join("");
}
const opts=v=>CITIES.map(c=>`<option ${c===v?"selected":""}>${c}</option>`).join("");

function vSearch(){
  const buses=S.searched?makeBuses():[];
  return `<form class="card search" data-act="search" onsubmit="return false">
    <div class="fr"><label for="f">From</label><select id="f">${opts(S.from)}</select></div>
    <button type="button" class="swap" data-act="swap" aria-label="Swap cities">⇄</button>
    <div class="to"><label for="t">To</label><select id="t">${opts(S.to)}</select></div>
    <div class="dt"><label for="dt">Date</label><input id="dt" type="date" min="${new Date().toISOString().slice(0,10)}" value="${S.date}"></div>
    <button class="btn" data-act="search">Search buses</button></form>
    ${S.searched?`<section class="list"><div><h2>${S.from} to ${S.to}</h2><p class="sub">${fdate(S.date)} · ${buses.length} buses</p></div>
    ${buses.map((b,i)=>{const free=b.total-b.booked.length;return `<article class="card bus">
      <div><div class="op">${b.op}</div><span class="tag">${b.type}</span></div>
      <div class="route"><strong>${hm(b.dep)}</strong><div class="line"><em>${dur(b.dur)}</em></div><strong>${arrTxt(b)}</strong></div>
      <div class="price"><strong>${inr(b.price)}</strong><span class="left ${free<10?"low":""}">${free} seats left</span><br>
      <button class="btn" style="margin-top:8px" data-act="pick" data-i="${i}">Select seats</button></div></article>`}).join("")}</section>`:""}
    <p class="err" role="alert">${S.err}</p>`;
}

function vSeats(){
  const b=S.bus, fare=S.seats.length*b.price, tax=Math.round(fare*.05);
  const rows=Array.from({length:ROWS},(_,i)=>`<div class="row">${LET.map(l=>{
    if(!l)return"<i></i>";const id=(i+1)+l,bk=b.booked.includes(id);
    return `<button class="seat" data-act="seat" data-id="${id}" ${bk?"disabled":""} aria-pressed="${S.seats.includes(id)}" aria-label="Seat ${id}${bk?", booked":""}">${id}</button>`}).join("")}</div>`).join("");
  return `<div class="layout"><div class="card"><h2>Choose your seats</h2><p class="sub">Select up to 6 seats.</p>
    <div class="deck"><div class="drv">Driver</div>${rows}</div>
    <div class="key"><span><i></i>Available</span><span><i style="background:var(--ink)"></i>Selected</span><span><i style="background:var(--booked);border-color:var(--booked)"></i>Booked</span></div></div>
    <aside class="card sum"><h3>${b.op}</h3><p class="sub">${b.type} · ${S.from} to ${S.to}<br>${fdate(S.date)}, ${hm(b.dep)} – ${arrTxt(b)}</p>
    <dl><div class="r"><dt>Seats</dt><dd style="margin:0">${S.seats.length?S.seats.join(", "):"None yet"}</dd></div>
    <div class="r"><dt>Fare</dt><dd style="margin:0">${inr(fare)}</dd></div><div class="r"><dt>GST 5%</dt><dd style="margin:0">${inr(tax)}</dd></div>
    <div class="r tot"><dt>Total</dt><dd style="margin:0">${inr(fare+tax)}</dd></div></dl>
    <button class="btn" style="width:100%;margin-top:12px" data-act="toPax" ${S.seats.length?"":"disabled"}>Continue</button>
    <button class="ghost" data-act="back0">Change bus</button></aside></div>`;
}

function vPax(){
  const b=S.bus, total=Math.round(S.seats.length*b.price*1.05);
  return `<div class="layout"><form class="card" onsubmit="return false"><h2>Passenger details</h2><p class="sub">Names should match a valid ID.</p>
    <div class="pax">${S.seats.map((s,i)=>`<div class="g"><div class="seatpill">${s}</div>
      <div><label for="n${i}">Full name</label><input id="n${i}" autocomplete="name"></div>
      <div class="age"><label for="a${i}">Age</label><input id="a${i}" type="number" min="1" max="99"></div></div>`).join("")}
      <div class="g" style="grid-template-columns:1fr 1fr"><div><label for="ph">Mobile number</label><input id="ph" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel"></div>
      <div><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div></div></div>
    <p class="err" id="perr" role="alert"></p>
    <button class="btn" style="width:100%" data-act="pay">Pay ${inr(total)}</button>
    <p class="sub" style="text-align:center;margin-top:8px">Demo only. No payment is taken.</p></form>
    <aside class="card sum"><h3>${S.from} to ${S.to}</h3><p class="sub">${b.op} · ${b.type}<br>${fdate(S.date)}, ${hm(b.dep)}</p>
    <div class="r tot" style="display:flex;justify-content:space-between"><span>${S.seats.length} seat${S.seats.length>1?"s":""}</span><span>${inr(total)}</span></div>
    <button class="ghost" data-act="toSeats">Change seats</button></aside></div>`;
}

function vTicket(){
  const b=S.bus,t=S.ticket;
  return `<div class="ticket"><div class="tk1"><div style="display:flex;justify-content:space-between"><span class="ok">Booking confirmed</span><span>${t.id}</span></div>
    <div class="route" style="margin-top:14px"><strong>${S.from}</strong><div class="line"><em>${dur(b.dur)}</em></div><strong>${S.to}</strong></div></div>
    <div class="tk2"><div class="grid2"><div><small>Date</small>${fdate(S.date)}</div><div><small>Departs · Arrives</small>${hm(b.dep)} · ${arrTxt(b)}</div>
    <div><small>Operator</small>${b.op}</div><div><small>Bus type</small>${b.type}</div>
    <div style="grid-column:1/-1"><small>Passengers</small>${t.pax.map(p=>`${p.name} (seat ${p.seat})`).join("<br>")}</div>
    <div><small>Contact</small>${t.phone}</div><div><small>Amount paid</small>${inr(t.total)}</div></div><div class="bars" aria-hidden="true"></div></div></div>
    <div class="acts"><button class="btn" onclick="window.print()">Print ticket</button><button class="btn" style="background:var(--card);border:1.5px solid var(--ink);color:var(--ink)" data-act="again">Book another</button></div>`;
}

function draw(){
  steps();app.innerHTML=[vSearch,vSeats,vPax,vTicket][S.step]();
  if(S.step===2){window.scrollTo({top:0})}
}

app.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;
  if(a==="swap"){const f=$("#f").value;S.from=$("#t").value;S.to=f;S.date=$("#dt").value||S.date;draw()}
  if(a==="search"&&el.tagName==="BUTTON"){
    S.from=$("#f").value;S.to=$("#t").value;S.date=$("#dt").value;
    if(S.from===S.to){S.err="Choose two different cities.";S.searched=false}
    else if(!S.date){S.err="Pick a travel date.";S.searched=false}
    else{S.err="";S.searched=true}
    draw();if(S.searched)$(".list").scrollIntoView({behavior:"smooth"});
  }
  if(a==="pick"){S.bus=makeBuses()[+el.dataset.i];S.seats=[];S.step=1;draw();window.scrollTo({top:0})}
  if(a==="seat"){const id=el.dataset.id,i=S.seats.indexOf(id);
    if(i>-1)S.seats.splice(i,1);else if(S.seats.length<6)S.seats.push(id);
    S.seats.sort((x,y)=>parseInt(x)-parseInt(y)||x.localeCompare(y));draw();}
  if(a==="back0"){S.step=0;draw()}
  if(a==="toPax"){S.step=2;draw()}
  if(a==="toSeats"){S.step=1;draw()}
  if(a==="again"){S.step=0;S.searched=false;S.seats=[];draw()}
  if(a==="pay"){
    const pax=S.seats.map((s,i)=>({seat:s,name:$("#n"+i).value.trim(),age:$("#a"+i).value}));
    const ph=$("#ph").value.trim(),em=$("#em").value.trim(),er=$("#perr");
    if(pax.some(p=>p.name.length<2||!p.age)){er.textContent="Enter a name and age for every passenger.";return}
    if(!/^[6-9]\d{9}$/.test(ph)){er.textContent="Enter a valid 10-digit mobile number.";return}
    if(em&&!/^\S+@\S+\.\S+$/.test(em)){er.textContent="Enter a valid email address or leave it blank.";return}
    S.ticket={id:"HLT"+Math.random().toString(36).slice(2,8).toUpperCase(),pax,phone:ph,total:Math.round(S.seats.length*S.bus.price*1.05)};
    S.step=3;draw();window.scrollTo({top:0});
  }
});
draw();
</script>
</body>
</html>
